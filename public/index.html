<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b13">
<title>WaysCase — коллекция Telegram Gifts</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/exchange.css">
</head>
<body>
<div class="app">
<header class="topbar">
  <h1>WaysCase</h1>
  <div class="balances">
    <div class="balance"><img class="currency-icon" src="/assets/currency/star.svg" alt="Игровые Stars" title="Игровые Stars"><strong id="starsBalance">—</strong></div>
    <div class="balance"><img class="currency-icon" src="/assets/currency/ton.svg" alt="Игровые TON" title="Игровые TON"><strong id="tonBalance">—</strong></div>
  </div>
</header>

<nav class="nav">
  <button class="active" data-tab="cases">Кейсы</button>
  <button data-tab="gifts">Подарки</button>
  <button data-tab="upgrade">Апгрейд</button>
  <button data-tab="inventory">Инвентарь</button>
  <button data-tab="profile">Профиль</button>
</nav>

<section class="page" id="page-cases">
  <h2 class="section-head">Кейсы</h2>
  <div id="catalogStatus" class="status">Загружаем каталог…</div>
  <div id="caseGrid" class="case-grid"></div>
</section>

<section class="page" id="page-gifts" hidden>
  <div class="market-head"><h2>Подарки</h2><small id="marketDate"></small></div>
  <p class="floor-note"><span id="marketCaption"></span> <a href="https://balticassets.eu/en/crypto/telegram-gifts/" target="_blank" rel="noopener noreferrer">Baltic Assets</a></p>
  <input id="giftSearch" type="search" aria-label="Поиск подарка" placeholder="Найти подарок" autocomplete="off">
  <div id="marketGrid" class="market-grid"></div>
</section>
<section class="page" id="page-upgrade" hidden>
  <div class="section-head"><h2>Апгрейд</h2></div>
  <div class="panel upgrade-board">
    <div class="upgrade-slots">
      <div class="upgrade-slot"><label for="pickOwn">Выберите свой NFT</label><button id="pickOwn">+</button></div>
      <div class="wheel" id="chanceWheel"><strong id="chanceLabel">—</strong><i id="wheelPointer" aria-hidden="true"></i></div>
      <div class="upgrade-slot"><label for="pickTarget">Выберите желаемый NFT</label><button id="pickTarget" disabled>+</button></div>
    </div>
    <p class="trade-status" id="upgradeStatus" role="status">При неудаче свой подарок сгорает.</p>
    <button class="primary full" id="startUpgrade" disabled>Старт</button>
  </div>
</section>
<section class="page" id="page-inventory" hidden>
  <div class="section-head"><div><h2>Мой инвентарь</h2></div></div>
  <div id="inventoryRoot"></div>
</section>

<section class="page" id="page-profile" hidden>

  <div id="profileRoot"></div>
</section>

</div>

<div class="modal" id="caseModal">
  <div class="modal-box">
    <div class="modal-head"><div><h2 id="modalTitle">Кейс</h2><p id="modalSubtitle"></p></div><button class="close" id="modalClose" aria-label="Закрыть">×</button></div>
    <p class="status" id="modalPreview"></p>
    <div class="gift-list" id="modalGiftList"></div>
    <div class="modal-actions"><button class="primary" id="openCaseButton">Открыть</button></div>
    <div class="opening" id="openingStage">

      <div class="roulette-window" id="rouletteWindow"><div class="roulette-track" id="rouletteTrack"></div></div>
    </div>
    <div class="notice" id="modalNotice"></div>
  </div>
</div>

<div class="gate" id="authGate" hidden>
  <h2>Открой WaysCase в Telegram</h2>
  <p id="authMessage">Чтобы сохранить подарки, запусти приложение из чата с ботом.</p>
</div>

<dialog class="sheet reward" id="rewardSheet" aria-labelledby="rewardHeading">
  <div class="sheet-head"><h2 id="rewardHeading">Ваш подарок</h2></div>
  <div class="reward-art"><img id="rewardPoster" alt=""><div class="reward-motion" id="rewardMotion"></div></div>
  <h3 id="rewardName"></h3><span class="status" id="rewardModel"></span>
  <div class="reward-actions"><button class="primary" id="keepGift">Забрать</button><button class="secondary" id="sellGift">Продать<span id="sellValue"></span></button></div>
  <p class="status" id="rewardStatus" role="status"></p>
</dialog>
<dialog class="sheet" id="pickSheet" aria-labelledby="pickHeading">
  <div class="sheet-head"><h2 id="pickHeading"></h2><button class="close" id="closePicker" aria-label="Закрыть">×</button></div>
  <div class="pick-grid" id="pickGrid"></div>
</dialog>

<script src="/vendor/lottie-light-5.13.0.min.js"></script>
<script src="/exchange.js"></script>
<script type="module">
import { upgradePercent } from "/upgrade-odds.mjs";
(function(){
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }
  const state = { catalogue: null, user: null, activeCase: null, busy: false };
  const $ = id => document.getElementById(id);
  const openingRequests = new Map();
  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const headers = () => {
    const h = { 'content-type':'application/json' };
    if (tg && tg.initData) h.authorization = 'tma ' + tg.initData;
    return h;
  };
  async function api(path, options) {
    const response = await fetch(path, Object.assign({ headers: headers(), cache:'no-store' }, options || {}));
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) {
      const error = new Error(payload.message || payload.error || 'Request failed');
      error.status = response.status;
      error.code = payload.error;
      error.nextOpenAt = payload.nextOpenAt;
      throw error;
    }
    return payload;
  }
  function giftForId(id) {
    return state.catalogue?.gifts.find(g => g.id === id) || null;
  }
  function giftImage(gift, model) {
    const url = model?.imageUrl || gift.models?.[0]?.imageUrl;
    return url ? '<img src="' + esc(url) + '" alt="' + esc(gift.name) + '">' : '';
  }
  const exchange = mountExchange({state,api,$,esc,giftForId,renderAll,upgradePercent});
  function canOpen(c) { return state.user && c.totalWeight > 0 && !state.busy && state.user.balances.stars >= c.price; }
  function renderBalances() {
    const b = state.user && state.user.balances ? state.user.balances : null;
    $('starsBalance').textContent = b ? Number(b.stars).toLocaleString('ru-RU') : '—';
    $('tonBalance').textContent = b ? Number(b.ton).toLocaleString('ru-RU') : '—';
  }

  const plural = new Intl.PluralRules('ru');
  const giftCount = n => n + ' ' + ({one:'подарок',few:'подарка',many:'подарков'}[plural.select(n)] || 'подарков');

  function renderCases() {
    const root = $('caseGrid');
    if (!state.catalogue) return;
    root.innerHTML = state.catalogue.cases.map(c => {
      return '<article class="case-card"><div class="case-art series-art"><img src="' + esc(c.coverImageUrl) + '" alt=""></div><div class="case-body">' +
        '<h3>' + esc(c.title) + '</h3><p class="case-meta">' + giftCount(c.gifts.length) + '</p>' +
        '<div class="case-card-actions"><button class="primary" data-open-case="' + esc(c.id) + '">За ' + c.price + ' ★</button>' +
        '<button class="case-info" data-info-case="' + esc(c.id) + '" aria-label="Содержимое кейса" title="Содержимое кейса"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 10.7v5.1M12 7.6h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div></div></article>';
    }).join('');

  }
  function renderInventory() {
    const root = $('inventoryRoot');
    const items = state.user && Array.isArray(state.user.inventory) ? state.user.inventory : [];
    if (!items.length) {
      root.innerHTML = '<div class="empty"><strong>Пока пусто</strong></div>';
      return;
    }
    root.innerHTML = '<div class="inventory-grid">' + items.map(item => {
      const gift = giftForId(item.giftId) || { emoji:item.giftEmoji || '✦', name:item.giftName, models:[] };
      const model = item.modelImageUrl ? {imageUrl:item.modelImageUrl} : null;
      const date = new Date(item.receivedAt).toLocaleDateString('ru-RU');
      return '<article class="inventory-item"><div class="inventory-image">' + giftImage(gift, model) + '</div><h3>' + esc(item.modelName || item.giftName) + '</h3><p>' + esc(item.caseName) + ' · ' + esc(date) + '</p><button class="secondary" data-view-item="' + esc(item.id) + '">Посмотреть</button></article>';
    }).join('') + '</div>';
  }

  function renderProfile() {
    const root = $('profileRoot');
    if (!state.user) return;
    const name = state.user.firstName || 'Профиль';
    const bonus = [];
    if (!state.user.starterStarsClaimed) bonus.push('10 000 Stars');
    if (!state.user.starterTonClaimed) bonus.push('500 TON');
    root.innerHTML = '<div class="panel"><div class="profile-head"><h2>' + esc(name) + '</h2>' +
      (state.user.username ? '<span>@' + esc(state.user.username) + '</span>' : '') + '</div>' +
      '<p>Открыто кейсов: <strong>' + Number(state.user.totalOpens || 0) + '</strong></p>' +
      (bonus.length ? '<div class="modal-actions"><button class="primary" id="claimStarterStars">Получить ' + bonus.join(' и ') + '</button><p class="status" role="status"></p></div>' : '') +
      '<p class="fine-print">Игровые очки и подарки без вывода.</p></div>';
  }

  function renderAll() {
    exchange.render();
    renderBalances();
    renderCases();
    renderInventory();
    renderProfile();
  }

  function getCase(id) {
    return state.catalogue.cases.find(c => c.id === id);
  }

  function openModal(caseId, showContents = false) {
    const c = getCase(caseId);
    if (!c || state.busy) return;
    state.activeCase = c;
    state.caseVersion = state.catalogue.market.version;
    $('modalTitle').textContent = c.title;
    $('modalSubtitle').textContent = giftCount(c.gifts.length) + ' · шанс окупиться ' + c.breakEvenPercent.toLocaleString('ru-RU',{maximumFractionDigits:1}) + ' %';
    $('modalPreview').textContent = showContents ? 'Минимум коллекции на Fragment · ' + state.catalogue.market.date : '';
    $('modalGiftList').hidden = !showContents;
    $('modalGiftList').innerHTML = c.gifts.map(g => '<div class="gift-row"><div class="gift-thumb">' + giftImage(g) + '</div><div class="gift-text"><strong>' + esc(g.name) + '</strong><small>' + esc(g.models[0].name) + '</small>' + exchange.price(g.id) + '</div><span class="rarity">' + g.chance.toLocaleString('ru-RU',{maximumFractionDigits:4}) + ' %</span></div>').join('');
    $('openCaseButton').disabled = !canOpen(c);
    $('openCaseButton').textContent = 'Открыть за ' + c.price + ' ★';
    $('openCaseButton').hidden = false;
    $('openingStage').classList.remove('show');
    $('modalNotice').textContent = !state.user ? 'Войди через Telegram.' : !canOpen(c) ? 'Недостаточно внутренних Stars.' : '';
    $('caseModal').classList.add('show');
  }

  function rouletteCard(gift, model, isTarget) {
    return '<div class="roulette-card"' + (isTarget ? ' data-target="true"' : '') + '>' +
      exchange.price(gift.id) + giftImage(gift, model) + '<small>' + esc(model ? model.telegramName : gift.name) + '</small></div>';
  }

  async function animateOpening(c, item) {
    const stage = $('openingStage');
    const track = $('rouletteTrack');
    const viewport = $('rouletteWindow');
    stage.classList.add('show');
    const targetGift = giftForId(item.giftId) || {id:item.giftId,name:item.giftName,emoji:item.giftEmoji,models:[]};
    const targetModel = item.modelImageUrl ? {name:item.modelName,telegramName:item.modelName,imageUrl:item.modelImageUrl,rarity:item.rarity} : null;
    const targetIndex = 32;
    const cards = [];
    for (let i=0;i<40;i++) {
      const gift = c.gifts[i % c.gifts.length];
      if (i === targetIndex) cards.push(rouletteCard(targetGift,targetModel,true));
      else {
        const models = gift.models || [];
        cards.push(rouletteCard(gift,models.length ? models[(i % models.length)] : null,false));
      }
    }
    track.innerHTML = cards.join('');

    track.style.transition = 'none';
    track.style.transform = 'translateX(0px)';
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const target = track.querySelector('[data-target="true"]');
    const distance = target.offsetLeft - (viewport.clientWidth / 2) + (target.offsetWidth / 2);
    track.style.transition = 'transform 4.8s cubic-bezier(.08,.68,.08,1)';
    track.style.transform = 'translateX(' + (-Math.max(0,distance)) + 'px)';
    await new Promise(resolve => setTimeout(resolve,5000));
    $('caseModal').classList.remove('show');
    exchange.reward(item, true);
  }

  async function openCase(caseId) {
    const c = getCase(caseId);
    if (!c || !canOpen(c)) return;
    state.busy = true;
    $('openCaseButton').disabled = true;
    $('openCaseButton').textContent = 'Открываем…';
    $('modalNotice').textContent = '';
    try {
      const requestId = openingRequests.get(caseId) || crypto.randomUUID();
      openingRequests.set(caseId, requestId);
      const response = await api('/api/open',{method:'POST',body:JSON.stringify({caseId, requestId, version:state.caseVersion})});
      openingRequests.delete(caseId);
      state.user.balances = response.balances;
      if (!state.user.inventory.some(i => i.id === response.item.id)) state.user.inventory.unshift(response.item);
      state.user.totalOpens = response.totalOpens;
      renderAll();
      $('modalGiftList').hidden = true;
      $('modalNotice').textContent = '';
      await animateOpening(c,response.item);
      if (state.user.balances.stars < c.price) $('modalNotice').textContent = 'Недостаточно внутренних Stars.';
    } catch (error) {
      if (error.code === 'quote_changed') {
        await exchange.refreshIfDue(true);
        state.busy = false;
        renderCases(); openModal(caseId,true);
      }
      $('modalNotice').textContent = error.message;
    } finally {
      state.busy = false;
      $('openCaseButton').textContent = 'Открыть за ' + state.activeCase.price + ' ★';
      $('openCaseButton').disabled = !canOpen(state.activeCase);
    }
  }

  document.querySelectorAll('[data-tab]').forEach(button => {
    button.addEventListener('click',() => {
      document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active',b === button));
      if (['gifts','upgrade'].includes(button.dataset.tab)) exchange.refreshIfDue();
      document.querySelectorAll('.page').forEach(p => p.hidden = p.id !== 'page-' + button.dataset.tab);
    });
  });
  $('profileRoot').addEventListener('click', async event => {
    const button = event.target.closest('#claimStarterStars');
    if (!button || button.disabled) return;
    button.disabled = true;
    button.textContent = 'Начисляем…';
    try {
      await api('/api/claim-starter-stars',{method:'POST',body:'{}'});
      const me = await api('/api/me');
      state.user = me.user;
      renderAll();
    } catch (error) {
      if (error.code === 'starter_balance_already_claimed') {
        const me = await api('/api/me').catch(() => null);
        if (me) state.user = me.user;
        renderAll();
      } else {
        button.disabled = false;
        button.textContent = 'Повторить получение';
        const note = button.parentElement.querySelector('.status');
        if (note) note.textContent = error.message || 'Не удалось получить бонус.';
      }
    }
  });
  $('caseGrid').addEventListener('click',event => {
    const info = event.target.closest('[data-info-case]');
    if (info) { openModal(info.dataset.infoCase, true); return; }
    const open = event.target.closest('[data-open-case]');
    if (open && !open.disabled) openModal(open.dataset.openCase, false);
  });
  $('openCaseButton').addEventListener('click',() => {
    if (state.activeCase) openCase(state.activeCase.id);
  });
  $('modalClose').addEventListener('click',() => !state.busy && $('caseModal').classList.remove('show'));
  $('caseModal').addEventListener('click',event => {
    if (!state.busy && event.target === $('caseModal')) $('caseModal').classList.remove('show');
  });

  async function init() {
    try {
      const catalogue = await api('/api/catalog');
      state.catalogue = catalogue;
      $('catalogStatus').hidden = true;
      exchange.render();
      renderCases();
    } catch (error) {
      $('catalogStatus').textContent = 'Не удалось загрузить каталог: ' + error.message;
      $('catalogStatus').classList.add('error');
      return;
    }
    if (!tg || !tg.initData) {
      $('authGate').hidden = false;
      return;
    }
    try {
      const me = await api('/api/me');
      state.user = me.user;
      $('authGate').hidden = true;
      renderAll();
    } catch (error) {
      $('authGate').hidden = false;
      $('authMessage').textContent = error.message || 'Не удалось подтвердить Telegram-сессию. Закрой и заново открой Mini App через бота.';
    }
  }
  init();
})();
</script>
</body>
</html>
